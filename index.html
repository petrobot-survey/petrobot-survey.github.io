<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ペット型ロボットとの関わり方に関する調査</title>
<!-- SNS で共有されたときにカードを表示させる。カードが出ない裸のURLは

<meta name="description" content="明治大学大学院 情報コミュニケーション研究科の修士論文のための学術調査です。ペット型ロボット（Moflin・LOVOT・aibo・Qoobo・NICOBO など）をお持ちの18歳以上の方に、全25問・匿名でお伺いします。">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:site_name" content="明治大学大学院 情報コミュニケーション研究科">

<meta property="og:url" content="https://petrobot-survey.github.io/">
<meta property="og:image" content="https://petrobot-survey.github.io/card.png?v=7">

<meta name="twitter:title" content="ペット型ロボットとの関わり方に関する調査">
<meta name="twitter:description" content="修士論文のための学術調査です。ペット型ロボット（Moflin・LOVOT・aibo・Qoobo・NICOBO など）をお持ちの18歳以上の方に、全25問・匿名でお伺いします。">
<meta name="twitter:image" content="https://petrobot-survey.github.io/card.png?v=7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='17' y='15' width='30' height='37' rx='5' fill='%23ffffff'/%3E%3Crect x='25' y='10' width='14' height='9' rx='3.5' fill='%23dbeafe'/%3E%3Cpath d='M24 31h16M24 40h11' stroke='%232563eb' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 和文Webフォントは読み込まない。モバイル回線では初回描画が遅れ、
     それ自体が離脱要因になる。和文は端末の標準（iOS: Hiragino Sans /
     Android: Noto Sans CJK）を使い、数字とラテン字のみ Inter を当てる。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── Tally 準拠のトークン ───────────────────────────────
   白地・細いグレー罫・キーバッジ付き選択肢・淡いティント選択。
   単一テーマで固定する：回答者ごとに配色が変わると提示刺激が
   変わるため、測定上こちらを優先する。                    */
:root{
  --bg:#fff; --ink:#1a1a1a; --muted:#6b7280; --faint:#9ca3af;
  --line:#e5e7eb; --line-hover:#d1d5db; --tint:#f9fafb;
  --accent:#2563eb; --accent-bg:#eff6ff; --accent-line:#93b4fb;
  --btn:#18181b; --btn-ink:#fff;
  --warn:#92620a; --warn-bg:#fffbeb; --warn-line:#fcd34d; --danger:#b91c1c;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",
         "Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  --barh:76px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:16px; line-height:1.75;
  font-feature-settings:"palt" 1; -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
/* 進行バー（Tally：最上端の細いバー） */
#rail{position:fixed;inset:0 0 auto 0;height:2px;background:var(--line);z-index:32}
#rail>i{display:block;height:100%;width:0;background:var(--accent);
  transition:width .4s cubic-bezier(.4,0,.2,1)}
/* 上部バー：戻る と のこり。親指が届きにくい位置なので情報だけを置く */
#topbar{position:fixed;top:2px;left:0;right:0;height:46px;z-index:31;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:0 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
#topbar[hidden]{display:none!important}
#topbar .sp{max-width:640px;margin:0 auto;width:100%;display:flex;
  align-items:center;justify-content:space-between;gap:12px}
#back{font:inherit;font-size:14px;color:var(--muted);background:none;border:none;
  padding:8px 10px 8px 0;margin-left:-2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#back[hidden]{visibility:hidden;display:inline-flex!important}
#remain{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
/* 下部バー：主操作は必ず親指の届く位置に固定する */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:31;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line)}
#bottombar[hidden]{display:none!important}
#bottombar .sp{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
#next{flex:1;justify-content:center;min-height:52px}
#bottombar .err{max-width:640px;margin:0 auto 10px;font-size:13.5px;line-height:1.6}
#bottombar .err:empty{display:none}
.hasbar{padding-top:48px}
.wrap{max-width:640px;margin:0 auto;
  padding-block:20px calc(var(--barh) + env(safe-area-inset-bottom) + 28px);
  padding-left:16px;padding-right:16px}
@media (min-width:520px){.wrap{padding-left:24px;padding-right:24px;padding-top:32px}}
.step{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}#rail>i{transition:none}}

/* ── 文字（Tally：太めのタイトル、灰色の説明） ── */
h1{font-size:clamp(27px,7vw,34px);font-weight:700;line-height:1.35;
  letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance}
h2{font-size:clamp(22px,5.6vw,27px);font-weight:700;line-height:1.4;
  letter-spacing:-.018em;margin:0 0 12px;text-wrap:balance}
/* Tally の質問ラベルは見出しではなく本文寄り。太らせすぎない */
.q{font-size:16.5px;font-weight:600;line-height:1.6;letter-spacing:-.005em;
  margin:0 0 4px;text-wrap:pretty}
.desc{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 4px}
.q + .opts,.desc + .opts{margin-top:14px}
.lede{font-size:16px;color:var(--muted);line-height:1.75;margin:0 0 28px}
.relink{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
/* 所属の明示。折りたたみの中にあると、開く前に離脱した人には
   「誰がやっている調査か」が伝わらない。最初の画面で必ず見える位置に置く */
.org{display:inline-block;font-size:13.5px;color:var(--muted);line-height:1.5;
  margin:0 0 14px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--tint)}
.body-text{font-size:15px;line-height:1.75;margin:0 0 10px}
h3{font-size:15px;color:var(--ink);font-weight:600;margin:28px 0 6px;letter-spacing:-.005em}
.hint{font-size:13px;color:var(--faint);margin:10px 0 0}
.todo{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
  border-radius:5px;padding:1px 7px;font-size:12.5px;font-weight:600;white-space:nowrap}

/* ── 選択肢（Tally のマルチプルチョイス） ──────────────
   横並び7個は和文ラベルが潰れるため縦積み（README §9.2 原則5）。
   入力方式は7件法の選択のまま（§9.3）。
   第2部＝全ラベル／第3部＝両端のみ。行の形は完全に同一。      */
.opts{display:flex;flex-direction:column;gap:6px;margin:0}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;
  min-height:48px;padding:9px 12px;
  background:var(--bg);border:1px solid var(--line);border-radius:6px;
  font:inherit;font-size:15px;color:var(--ink);text-align:left;cursor:pointer;
  transition:background .1s ease,border-color .1s ease;
  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover) and (pointer:fine){.opt:hover{background:var(--tint)}}
.key{
  flex:none;min-width:23px;height:23px;padding:0 4px;
  display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;
  background:var(--bg);color:var(--muted);
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;
  box-shadow:0 1px 0 rgba(16,24,40,.03);
  transition:background .1s ease,border-color .1s ease,color .1s ease;
}
.opt .lab{min-width:0;overflow-wrap:anywhere}
.opt[aria-checked="true"]{background:var(--accent-bg);border-color:var(--accent)}
.opt[aria-checked="true"] .key{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── 第3部の7件法：横一列 ────────────────────────────
   第3部は両端ラベルのみで中間にラベルが無いため、横並びでも
   和文が潰れない（第2部が横に出来ないのはラベル7個が理由）。
   ECR-GO 正本の提示形式（全く当てはまらない1－2－…－7 非常によく当てはまる）
   にも近い。aspect-ratio は flex の縮小を妨げるので使わないこと。 */
.scale7{display:flex;gap:5px;margin:0}
.scale7 button{
  flex:1 1 0;min-width:0;width:0;height:54px;padding:0;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);
  font:inherit;font-size:15px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .1s ease,border-color .1s ease,color .1s ease;
  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover) and (pointer:fine){.scale7 button:hover{background:var(--tint)}}
.scale7 button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.scale7 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 両端＋中央の3点。中央は7個のボタンの中心＝「4」の真下に来る。
   狭い画面では中央ラベルを次の行へ送り、文字が潰れないようにする。 */
.anchors{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:9px;
  font-size:11.5px;line-height:1.5;color:var(--muted)}
.anchors span{min-width:0;overflow-wrap:anywhere}
.anchors span:last-child{text-align:right}
.anchors .mid{text-align:center}
@media (max-width:379px){
  .anchors{grid-template-columns:1fr 1fr;row-gap:4px}
  .anchors .mid{order:3;grid-column:1 / -1;text-align:center}
}
.q + .scale7,.desc + .scale7{margin-top:16px}

/* まとめ表示：Tally は項目間に罫線を引かず、余白だけで区切る */
.qitem,.fitem{margin:0 0 42px}
.qitem:last-of-type,.fitem:last-of-type{margin-bottom:0}

/* ── 入力（Tally のショートアンサー） ── */
.inp{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%;
  transition:border-color .12s}
/* 年齢・時期は select にする。iOS はホイールピッカー、Android はスクロール一覧。
   font-size は 16px 未満にしないこと（iOS で自動ズームが起きる） */
.sel{
  font:inherit;font-size:16px;padding:11px 36px 11px 12px;
  border:1px solid var(--line);border-radius:6px;background-color:var(--bg);color:var(--ink);
  appearance:none;-webkit-appearance:none;cursor:pointer;max-width:100%;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:14px;
  transition:border-color .12s;
}
@media (hover:hover) and (pointer:fine){.sel:hover{border-color:var(--line-hover)}}
.sel:invalid,.sel.blank{color:var(--faint)}
@media (hover:hover) and (pointer:fine){.inp:hover{border-color:var(--line-hover)}}
.inp::placeholder{color:var(--faint)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sel{flex:1 1 0;min-width:0}
.w6{width:7em}.w5{width:5.6em}

/* ── 操作（Tally：ボタン＋「Enter ↵」の小さなヒント） ── */
.actions{display:flex;align-items:center;gap:16px;margin-top:34px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;padding:11px 22px;border-radius:6px;
  border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer;
  transition:opacity .12s;-webkit-tap-highlight-color:transparent}
@media (hover:hover) and (pointer:fine){.btn:hover{opacity:.85}}
.btn:disabled{opacity:.3;cursor:not-allowed}
.enter{display:none;font-size:13px;color:var(--faint)}
@media (hover:hover) and (pointer:fine){.enter{display:inline}}
.enter b{font-weight:600;color:var(--muted)}
.keyhint{display:none;font-size:12.5px;color:var(--faint);margin-top:16px}
@media (hover:hover) and (pointer:fine){.keyhint{display:block}}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:34px;font-size:12.5px;color:var(--faint)}
.back{font:inherit;font-size:13px;color:var(--muted);background:none;border:none;
  padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px}

.count{font-variant-numeric:tabular-nums}
.err{color:var(--danger);font-size:14.5px;margin-top:12px}
/* 未回答の項目を目印で示す（探させない） */
.qitem.missing,.fitem.missing{position:relative}
.qitem.missing::before,.fitem.missing::before{
  content:"";position:absolute;left:-13px;top:0;bottom:0;width:3px;
  border-radius:2px;background:var(--danger);opacity:.45}
.autosave{font-size:12.5px;color:var(--faint);margin:28px 0 0;line-height:1.7}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line);font-weight:500}
@media (hover:hover) and (pointer:fine){.btn.ghost:hover{background:var(--tint);opacity:1}}

/* ── その他 ── */
.consent-box{display:flex;gap:11px;align-items:flex-start;font-size:15px;cursor:pointer;
  padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);margin-top:22px;
  transition:background .1s}
@media (hover:hover) and (pointer:fine){.consent-box:hover{background:var(--tint)}}
.consent-box input{width:19px;height:19px;margin:3px 0 0;flex:none;accent-color:var(--accent)}
.callout{background:var(--tint);border-radius:6px;
  padding:13px 15px;font-size:14px;line-height:1.7;margin:0 0 24px;color:var(--muted)}
.callout b{color:var(--ink)}
.quote{background:var(--tint);border-radius:6px;padding:14px 16px;margin:0 0 20px;
  font-size:14px;line-height:1.8;color:var(--muted)}
ul.plain{margin:0 0 14px;padding-left:1.15em;font-size:15px}
ul.plain li{margin-bottom:4px}
details{margin:14px 0 0;font-size:14px}
summary{cursor:pointer;color:var(--accent);padding:6px 0}
details .inner{border-left:2px solid var(--line);padding-left:14px;margin-top:8px;
  color:var(--muted);font-size:13.5px}
code{background:var(--tint);border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:13px}
pre{background:var(--tint);border:1px solid var(--line);padding:13px;border-radius:7px;
  overflow:auto;font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div id="rail"><i></i></div>
<header id="topbar" hidden><div class="sp">
  <button id="back" type="button">← 戻る</button>
  <span id="remain"></span>
</div></header>
<div class="wrap"><main id="app"></main></div>
<footer id="bottombar" hidden>
  <!-- エラー表示は全画面でここ1か所。押したボタンの真上に出るので見落とされない -->
  <p id="err" class="err" role="alert" aria-live="polite"></p>
  <div class="sp"><button class="btn" id="next" type="button">次へ</button></div>
</footer>

<script>
"use strict";
/* ============================================================
   ペット型ロボットとの関わり方に関する調査 — 実装プロトタイプ
   （回答者に示す表題からは「愛着」を外した。表題で自己選択が起きるのを避けるため。
    研究目的は同意画面の折りたたみ内に明記している。2026-09-22）
   ------------------------------------------------------------
   準拠文書（矛盾時は上が優先）
     1. README_ADDENDUM_確定事項_キムユンソ.md
     2. 質問項目モックアップ_改訂版_キムユンソ.docx
     3. README_研究設計_キムユンソ.md（§9.2 UX原則／§9.3 制約／§9.4 画面単位）
     4. README_REVIEW_未解決課題リスト_キムユンソ.md（R-01〜R-27）

   第4版：Tally の見た目を保ったままセクション単位にまとめた
     - 白地・620px の狭い一段組・細いグレー罫のみ（カード装飾なし）
     - 選択肢はキーバッジ付きの行（Tally のマルチプルチョイス）
     - 選択は淡いティント＋アクセント罫（塗り潰しではない）
     - 最上端に細い進行バー、ボタン脇に「Enter ↵」ヒント
     - 画面単位は §9.4 案C：フェイスシートは一画面、リッカートは
       ブロック内で最大4問ずつ。画面がブロックをまたがないので、
       回答者にはセクションのまとまりとして見える。
       A(4)=1画面 / B(6)=3+3 / C(7)=4+3 / D(8)=4+4
     - 自動前進は行わない。まとめて答えて「次へ」。
       §9.3「娯楽性に寄せない（ゲームを進めるために答えてしまう）」への配慮でもある。

   測定上の確定事項は維持
     - 7件法（1〜7）の選択方式。スライダー・星評価にしない（§9.3）
     - 第2部＝全ラベル（縦積み）／第3部＝両端ラベルのみ（横一列）
       第3部は中間ラベルが無いため横並びでも和文が潰れず、ECR-GO 正本の
       提示形式（全く当てはまらない1－2－…－7 非常によく当てはまる）に近い。
       ※ ADDENDUM 付随事項の「ボタンの大きさ・配置・色・フォントは全体で
         揃える」のうち「配置」のみ意図的に変えている。同条項の趣旨は
         「別の設問に変わったと感じさせない」ことだが、第3部は対象転換を
         専用画面で明示する区間であり、原尺度への忠実性を優先した。
         色・書体・角丸・罫の太さは第2部と同一に保っている。
         採否が確定したら ADDENDUM に修正として記録すること。
     - 和文ラベル7個は横並びでは潰れるため縦積み（§9.2 原則5）
     - 第3部の教示文は ECR-GO 正本 付録TableA 注記a) から転記
       （末尾の回答操作案内のみWeb用に置換。「○印」「右にある」は紙面専用）
     - 第3部の項目文面は ECR-GO 正本 Table1 から転記（D7は原文どおり読点なし）
     - 第3部の冒頭で対象転換（ロボット→人）を明示
     - ブロックラベル・尺度名・採点情報は非表示
     - 逆転処理は行わず生値のまま保存

/* 固定バーの表示を画面に合わせて更新する */

  var top=document.getElementById("topbar"), bot=document.getElementById("bottombar"),
      back=document.getElementById("back"), rem=document.getElementById("remain"),
      next=document.getElementById("next"), body=document.body;
  var nav=(sc.kind!=="done");

  if(!nav){ top.hidden=true; body.classList.remove("hasbar"); return; }

  /* フェイスシートでは数字を出さない（答えても減らない数字は混乱を招く）。
     第2部の案内画面で「のこり 25 問」が初めて現れる */
  rem.textContent = (sc.kind==="consent"||sc.kind==="face") ? "" : remainText();
  /* 戻るも残量も無い画面（同意画面）では上部バーを出さない。空の帯を置かない */
  var showTop=(!back.hidden || rem.textContent!=="");
  top.hidden=!showTop;
  body.classList.toggle("hasbar",showTop);

function recordTime(sc){
  var t=Date.now()-enteredAt;
  S.screenTime[sc.id]=(S.screenTime[sc.id]||0)+t;
  if(sc.block) S.blockTime[sc.block]=(S.blockTime[sc.block]||0)+t;
}
function advance(sc){
  recordTime(sc); idx++;
  render(); saveDraft();
}

/* ---------- 送信 ----------
   最終画面の「送信」で呼ぶ。サーバーが保存を確認するまで完了画面を出さない。
   失敗したら回答を端末に残したまま、もう一度「送信」を押してもらう。
   同じ回答IDで再送されてもサーバー側で重複排除される。
   回答IDは画面には表示しない（2026-09-23 決定：匿名のため送信後の撤回は受け付けない）。
   送信データには引き続き含め、サーバー側の重複排除にのみ用いる。 */
var submitting=false;
function newRespId(){
  var c="ABCDEFGHJKMNPQRSTUVWXYZ23456789", a=new Uint32Array(8), s="";
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(a);
  else for(var j=0;j<8;j++) a[j]=Math.floor(Math.random()*4294967296);
  for(var i=0;i<8;i++){ s+=c[a[i]%c.length]; if(i===3) s+="-"; }
  return s;
}
function finish(sc){
  if(submitting) return;
  recordTime(sc); enteredAt=Date.now();          // 再送時に時間を二重計上しない
  S.meta.finishedAt=new Date().toISOString();
  S.meta.totalMs=Object.keys(S.screenTime).reduce(function(a,k){return a+S.screenTime[k];},0);
  S.meta.complete=true;
  S.meta.respId=S.meta.respId||newRespId();
  S.meta.formVersion=FORM_VERSION;
  saveDraft();
  if(!ENDPOINT){ idx++; render(); saveDraft(); return; }   // 予備調査モード
  var btn=document.getElementById("next"), err=document.getElementById("err");
  submitting=true; btn.disabled=true; btn.textContent="送信中…";
  if(err) err.textContent="";
  postWithRetry(flat(),2).then(function(){
    submitting=false;
    try{ localStorage.setItem(DONE_KEY,S.meta.respId); }catch(e){}
    clearDraft(); idx++; render();
  },function(){
    submitting=false; btn.disabled=false; btn.textContent="送信";
    if(err) err.textContent="送信できませんでした。通信環境をご確認のうえ、もう一度「送信」を"+
      "押してください。回答はこの端末に保存されています。";
    saveDraft();
  });
}
function postWithRetry(payload,tries){
  return new Promise(function(resolve,reject){
    var n=0;
    (function go(){
      n++;
      var ctl=window.AbortController?new AbortController():null;
      var timer=setTimeout(function(){ if(ctl) ctl.abort(); },20000);
      /* text/plain で送るとプリフライトが発生しない（Apps Script は OPTIONS に応答しないため） */
      fetch(ENDPOINT,{method:"POST",redirect:"follow",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
      .then(function(r){ clearTimeout(timer); return r.json(); })
      /* id まで一致したときだけ成功とみなす。デプロイ直後などに POST が doGet の応答（ok:true だが id なし）にすり替わることがあり、ok だけ見ると保存されていないのに完了画面が出る */
      .then(function(j){ if(j&&j.ok&&j.id===payload.meta_respId) resolve(j); else throw new Error((j&&j.error)||"ng"); })
      .catch(function(){ clearTimeout(timer); if(n<tries) setTimeout(go,1500); else reject(); });
    })();
  });
}
function onNext(sc){
  var err=document.getElementById("err"); if(err) err.textContent="";
  if(sc.kind==="consent"){
    S.meta.consentAt=new Date().toISOString();
    S.meta.startedAt=S.meta.startedAt||S.meta.consentAt;
    S.meta.device=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"mobile":"desktop";
    S.meta.ua=navigator.userAgent; S.meta.screenW=window.innerWidth;
    S.meta.respId=S.meta.respId||newRespId();
    S.meta.formVersion=FORM_VERSION;
  }
  if(sc.kind==="face"){
    S.answers.SQ3_free=(S.answers.SQ3==="その他")
      ? ((document.getElementById("SQ3free")||{}).value||"") : "";
    var miss=[];
    ["SQ1","SQ3","SQ4","SQ5"].forEach(function(k){if(!S.answers[k])miss.push(k);});
    if(S.answers.SQ2==null) miss.push("SQ2");
    if(S.answers.SQ6_year==null||S.answers.SQ6_month==null) miss.push("SQ6");
    if(S.answers.SQ3==="その他"&&!S.answers.SQ3_free.trim()) miss.push("SQ3");
    if(miss.length){
      markMissing();
      err.textContent="未回答の項目が "+miss.length+" つあります。印の付いた項目にお答えください。";
      return;}
    if(S.answers.SQ2<MIN_AGE){
      document.getElementById("rail").hidden=true;
      document.getElementById("topbar").hidden=true;
      document.getElementById("bottombar").hidden=true;
      document.body.classList.remove("hasbar");
      document.getElementById("app").innerHTML=viewIneligible();
      clearDraft(); return;
    }
    /* 選択式なので範囲外は入り得ないが、未来日付だけは組み合わせで起こりうる */
    var now=new Date(),ny=now.getFullYear(),nm=now.getMonth()+1,Y=S.answers.SQ6_year,M=S.answers.SQ6_month;
    if(Y===ny&&M>nm){
      markMissing();
      err.textContent="お迎えの時期をご確認ください（未来の日付は選べません）。";return;}
  }
  if(sc.kind==="likert"&&REQUIRE){
    var blanks=sc.items.filter(function(it){return S.answers[it[0]]==null;});
    if(blanks.length){
      markMissing();
      err.textContent="未回答の項目が "+blanks.length+" つあります。印の付いた項目にお答えください。";
      return;}
  }
  if(SCREENS[idx+1]&&SCREENS[idx+1].kind==="done"){ finish(sc); return; }
  advance(sc);
}

/* 委譲リスナーは起動時に一度だけ登録する（#app は再生成されないため） */
function bindChrome(){
  document.getElementById("back").addEventListener("click",function(){
    if(idx<=0) return;
    recordTime(SCREENS[idx]); idx--; render(); saveDraft();
  });
  document.getElementById("next").addEventListener("click",function(){
    onNext(SCREENS[idx]);
  });
}
function bindDelegated(){
  document.getElementById("app").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.code){
      var c=b.dataset.code, v=+b.dataset.val;
      noteAnswer(c, S.answers[c], v);
      S.answers[c]=v; markGroup(b); clearMissing(b); updateRemain(); saveDraft();
    }
    if(b.dataset.opt){
      noteAnswer(b.dataset.opt, S.answers[b.dataset.opt], b.dataset.val);
      S.answers[b.dataset.opt]=b.dataset.val; markGroup(b); clearMissing(b); updateRemain(); saveDraft();
      if(b.dataset.opt==="SQ3"){
        var other=(b.dataset.val==="その他"), box=document.getElementById("SQ3other");
        if(box) box.hidden=!other;
        if(!other) S.answers.SQ3_free="";
        else { var fi=document.getElementById("SQ3free"); if(fi) fi.focus(); }
      }
    }
  });
  /* select とテキストの変更は即時に保存する。自動保存と未回答マークを正しく働かせるため */
  document.getElementById("app").addEventListener("change",function(e){
    var t=e.target;
    if(t.id==="SQ2"){ var a=t.value===""?null:+t.value; noteAnswer("SQ2",S.answers.SQ2,a); S.answers.SQ2=a; }
    if(t.id==="SQ6y"||t.id==="SQ6m"){
      var k=(t.id==="SQ6y")?"SQ6_year":"SQ6_month", v2=t.value===""?null:+t.value;
      noteAnswer("SQ6", S.answers[k], v2); S.answers[k]=v2;
    }
    if(t.id==="SQ3free") S.answers.SQ3_free=t.value;
    if(t.classList&&t.classList.contains("sel")) t.classList.toggle("blank",t.value==="");
    if(t.id&&t.id.indexOf("SQ")===0){ clearMissing(t); updateRemain(); saveDraft(); }
  });
  document.getElementById("app").addEventListener("input",function(e){
    if(e.target.id==="SQ3free"){ S.answers.SQ3_free=e.target.value; updateRemain(); saveDraft(); }
  });
  document.addEventListener("keydown",function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==="Enter"){
      var t=e.target.tagName&&e.target.tagName.toLowerCase();
      if(t==="button") return;               // ボタン自身の既定動作に任せる
      var n=document.getElementById("next");
      if(n&&!n.disabled){e.preventDefault();n.click();}
    }
  });
}
/* 未回答の項目に目印を付け、最初の1つへスクロールする。
   4問まとめ表示では「どれが未回答か」を探させないことが離脱対策になる。 */
function markMissing(){
  var first=null, els=document.querySelectorAll(".qitem,.fitem");
  for(var i=0;i<els.length;i++){
    var el=els[i], c=el.getAttribute("data-code"), blank=false;
    if(!c) continue;
    if(c==="SQ2") blank=(S.answers.SQ2==null);
    else if(c==="SQ6") blank=(S.answers.SQ6_year==null||S.answers.SQ6_month==null);
    else if(c==="SQ3") blank=(!S.answers.SQ3||(S.answers.SQ3==="その他"&&
             !String(S.answers.SQ3_free||"").trim()));
    else blank=(S.answers[c]==null);
    if(blank){ el.classList.add("missing"); if(!first) first=el; }
    else el.classList.remove("missing");
  }
  if(first&&first.scrollIntoView) first.scrollIntoView({behavior:"smooth",block:"center"});
}
function clearMissing(b){
  var host=b.closest(".qitem")||b.closest(".fitem");
  if(host) host.classList.remove("missing");
}
/* 項目ごとの回答ログ。どの設問で手が止まったかを後から見るために使う。
   t   ＝ その画面に入ってから最初に答えるまでのミリ秒
   last＝ 最後に答えを確定したときのミリ秒（答え直した場合は最後の時刻）
   chg ＝ 答えを変えた回数（迷いの指標。時間より素直に出ることが多い）
   まとめ表示では、2問目以降の t は「前の設問を答えた時刻からの差」で読む。
   厳密な1問あたりの所要時間が必要なら MAX_PER_SCREEN=1 にして測ること。 */
function noteAnswer(code, prev, next){
  if(prev===next) return;
  var t=Date.now()-enteredAt, e=S.itemLog[code];
  if(!e){ S.itemLog[code]={t:t,last:t,chg:0}; }
  else { e.chg++; e.last=t; }
}
function markGroup(b){
  /* .opts（縦積み）と .scale7（横一列）の両方に対応する */
  var g=b.parentElement.querySelectorAll("button");
  for(var i=0;i<g.length;i++) g[i].setAttribute("aria-checked",g[i]===b);
}

/* ---------- 書き出し（予備調査用） ---------- */
function flat(){
  var o={};
  Object.keys(S.meta).forEach(function(k){o["meta_"+k]=S.meta[k];});
  Object.keys(S.answers).forEach(function(k){o[k]=S.answers[k];});
  Object.keys(S.blockTime).forEach(function(k){o["time_"+k+"_ms"]=S.blockTime[k];});
  o.order=JSON.stringify(S.order);
  o.itemLog=JSON.stringify(S.itemLog);   // 項目別の所要時間・修正回数
  return o;
}
function dl(name,text,type){
  var u=URL.createObjectURL(new Blob([text],{type:type}));
  var a=document.createElement("a");a.href=u;a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(u);},1000);
}
function bindDone(){
  if(ENDPOINT) return;
  var o=flat(),stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  document.getElementById("dump").textContent=JSON.stringify(o,null,2);
  document.getElementById("dlJson").onclick=function(){
    dl("survey_"+stamp+".json",JSON.stringify(o,null,2),"application/json");};
  document.getElementById("dlCsv").onclick=function(){
    var ks=Object.keys(o);
    var row=ks.map(function(k){var v=o[k]==null?"":String(o[k]);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;});
    dl("survey_"+stamp+".csv","﻿"+ks.join(",")+"\n"+row.join(",")+"\n","text/csv");};
}

/* ---------- 起動 ---------- */
(function(){
  /* ?reset=1 で下書きと回答済み記録を消す（予備調査で1台の端末を使い回すとき用） */
  if(/[?&]reset=1\b/.test(location.search)){
    clearDraft(); try{ localStorage.removeItem(DONE_KEY); }catch(e){}
  }
  var d=loadDraft(), doneId=null;
  try{ doneId=localStorage.getItem(DONE_KEY); }catch(e){}
  bindDelegated(); bindChrome();
  /* 同じ端末からの二重回答を防ぐ（本番モードのみ） */
  if(ENDPOINT&&doneId){
    document.getElementById("rail").hidden=true;
    document.getElementById("topbar").hidden=true;
    document.getElementById("bottombar").hidden=true;
    document.getElementById("app").innerHTML='<div class="step">'+
      "<h2>この端末からは回答済みです</h2>"+
      '<p class="lede">ご協力いただき、ありがとうございました。</p>'+
      /* 同じ端末を家族で共有している場合、2人目が回答できずに離脱してしまう。
         本人の不用意な二重送信は引き続き防ぎつつ、別の回答者には道を残す。 */
      '<p class="body-text"><a class="relink" href="?reset=1">別の方が回答される場合はこちら</a></p>'+
      "</div>";
    return;
  }
  if(d&&d.idx>0&&d.idx<SCREENS.length-1){
    document.getElementById("topbar").hidden=true;
    document.getElementById("bottombar").hidden=true;
    document.getElementById("app").innerHTML=viewResume();
    document.getElementById("resumeYes").onclick=function(){
      S=d.S; idx=d.idx; enteredAt=Date.now(); render();};
    document.getElementById("resumeNo").onclick=function(){clearDraft(); render();};
    return;
  }
  render();
})();
</script>
</body>
